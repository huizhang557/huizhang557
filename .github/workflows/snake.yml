name: Generate Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: profile-updates
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Read profile username
        id: profile-config
        shell: bash
        run: echo "username=$(python -c 'import json; print(json.load(open("profile.config.json", encoding="utf-8"))["username"])')" >> "$GITHUB_OUTPUT"
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ steps.profile-config.outputs.username }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: push github-contribution-grid-snake.svg to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: output
          publish_dir: dist
          force_orphan: true
          github_token: ${{ github.token }}
