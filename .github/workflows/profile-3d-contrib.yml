name: GitHub Profile 3D Contrib

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: profile-updates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Read profile username
        id: profile-config
        shell: bash
        run: echo "username=$(python -c 'import json; print(json.load(open("profile.config.json", encoding="utf-8"))["username"])')" >> "$GITHUB_OUTPUT"
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ steps.profile-config.outputs.username }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No 3D contribution changes"
            exit 0
          fi
          git commit -m "chore: update 3d contribution graph"
          git push
